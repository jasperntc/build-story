<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build Story composer</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; width: 360px; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// Draws the story onto a 1080x1920 canvas and records it with MediaRecorder: no ffmpeg needed.
const W = 1080, H = 1920;
const canvas = document.getElementById('c');
const g = canvas.getContext('2d');
const story = await (await fetch('./frames.json')).json();
const images = await Promise.all(story.frames.map((f) => new Promise((ok, fail) => {
  const img = new Image();
  img.onload = () => ok(img);
  img.onerror = fail;
  img.src = f.src;
})));

const INTRO = 1.8, HOLD = story.hold, FADE = Math.min(0.35, HOLD / 3), OUTRO = 2.6;
const TOTAL = INTRO + images.length * HOLD + OUTRO;
const AMBER = '#ffb547', INK = '#f3efe6', DIM = '#9a9488', BG = '#0d0b09';
const SERIF = 'Georgia, "Times New Roman", serif';
const SANS = 'system-ui, "Segoe UI", Roboto, sans-serif';
const MONO = 'ui-monospace, Consolas, "Courier New", monospace';
const day = (d) => new Date(`${d}T00:00:00`).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const first = story.frames[0], last = story.frames[story.frames.length - 1];
const days = Math.max(1, Math.round((Date.parse(last.date) - Date.parse(first.date)) / 864e5));

function text(s, x, y, font, color, align = 'left') {
  g.font = font; g.fillStyle = color; g.textAlign = align; g.fillText(s, x, y);
}
/** Word-wraps into at most `max` lines, ending with … if it had to cut. */
function wrap(s, x, y, width, lineHeight, font, color, max = 2) {
  g.font = font;
  const words = s.split(/\s+/);
  const lines = [];
  let line = '';
  for (const w of words) {
    const next = line ? `${line} ${w}` : w;
    if (g.measureText(next).width > width && line) { lines.push(line); line = w; } else line = next;
  }
  if (line) lines.push(line);
  if (lines.length > max) { lines.length = max; lines[max - 1] = lines[max - 1].replace(/\s*\S*$/, '…'); }
  lines.forEach((l, i) => text(l, x, y + i * lineHeight, font, color));
}
function roundRect(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function phone(img, alpha) {
  if (!img || alpha <= 0) return;
  const ph = 1180, pw = Math.round(ph * img.width / img.height), x = (W - pw) / 2, y = 330;
  g.save();
  g.globalAlpha = alpha;
  g.shadowColor = 'rgba(255, 181, 71, .16)'; g.shadowBlur = 90;
  roundRect(x - 10, y - 10, pw + 20, ph + 20, 56); g.fillStyle = '#1b1814'; g.fill();
  g.shadowBlur = 0;
  roundRect(x, y, pw, ph, 46); g.clip();
  g.drawImage(img, x, y, pw, ph);
  g.restore();
}

function draw(t) {
  g.fillStyle = BG; g.fillRect(0, 0, W, H);
  const glow = g.createRadialGradient(W / 2, 900, 0, W / 2, 900, 900);
  glow.addColorStop(0, 'rgba(255, 181, 71, .10)'); glow.addColorStop(1, 'rgba(255, 181, 71, 0)');
  g.fillStyle = glow; g.fillRect(0, 0, W, H);

  text('✦  BUILD STORY', 90, 128, `500 30px ${MONO}`, AMBER);
  text(story.title, 90, 222, `400 88px ${SERIF}`, INK);
  text(`${day(first.date)}  →  ${day(last.date)}`, 90, 278, `400 30px ${MONO}`, DIM);

  const k = (t - INTRO) / HOLD; // which frame, with fractional progress
  const i = Math.max(0, Math.min(images.length - 1, Math.floor(k)));
  if (t < INTRO) {
    phone(images[0], Math.min(1, t / (INTRO * 0.7)));
    text(`${images.length} builds in ${days} days`, 90, 1650, `500 52px ${SANS}`, INK);
    text('from the first commit to the latest', 90, 1712, `400 32px ${MONO}`, DIM);
  } else if (t < INTRO + images.length * HOLD) {
    const into = (k - Math.floor(k)) * HOLD;
    phone(images[i - 1], into < FADE ? 1 : 0);
    phone(images[i], into < FADE ? into / FADE : 1);
    const f = story.frames[i];
    text(`#${i + 1} / ${images.length}  ·  ${day(f.date)}  ·  ${f.sha.slice(0, 7)}`, 90, 1612, `400 30px ${MONO}`, AMBER);
    wrap(f.title, 90, 1684, W - 180, 64, `500 52px ${SANS}`, INK);
  } else {
    phone(images[images.length - 1], 1);
    text('Shipped.', 90, 1660, `400 76px ${SERIF}`, INK);
    text(story.outro, 90, 1724, `400 32px ${MONO}`, DIM);
  }

  // Progress: one tick per build, filled up to now.
  const x0 = 90, x1 = W - 90, y = 1832, p = Math.max(0, Math.min(1, (t - INTRO) / (images.length * HOLD)));
  g.fillStyle = 'rgba(243, 239, 230, .14)'; g.fillRect(x0, y, x1 - x0, 6);
  g.fillStyle = AMBER; g.fillRect(x0, y, (x1 - x0) * p, 6);
  for (let n = 0; n <= images.length; n++) g.fillRect(x0 + (x1 - x0) * (n / images.length) - 1, y + 14, 2, 10);
}

window.poster = () => { draw(INTRO + Math.min(images.length - 1, Math.floor(images.length * 0.7)) * HOLD + HOLD / 2); return canvas.toDataURL('image/png').split(',')[1]; };

window.render = async () => {
  // Instagram takes MP4, not WebM; Chrome can record H.264 MP4 directly.
  const mime = ['video/mp4;codecs=avc1.640028', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm']
    .find((m) => MediaRecorder.isTypeSupported(m));
  const recorder = new MediaRecorder(canvas.captureStream(30), { mimeType: mime, videoBitsPerSecond: 10_000_000 });
  const chunks = [];
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  const stopped = new Promise((ok) => (recorder.onstop = ok));
  recorder.start(250);
  const t0 = performance.now();
  await new Promise((done) => {
    const tick = () => {
      const t = (performance.now() - t0) / 1000;
      draw(Math.min(t, TOTAL));
      t < TOTAL ? requestAnimationFrame(tick) : done();
    };
    tick();
  });
  recorder.stop();
  await stopped;
  const blob = new Blob(chunks, { type: mime });
  const data = await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(blob); });
  return { mime, data, seconds: TOTAL };
};

draw(0);
window.ready = true;
</script>
</body>
</html>
